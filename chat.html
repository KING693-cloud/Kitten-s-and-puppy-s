<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTH | SECURE LIVE CHAT</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* --- GLOBAL DESIGN SYSTEM --- */
        :root {
            --wa-bg: #0b141a;
            --wa-header: #202c33;
            --wa-sent: #005c4b;
            --wa-received: #202c33;
            --wa-text: #e9edef;
            --wa-green: #00a884;
            --time-color: rgba(255,255,255,0.6);
            /* Inquiry Blue Palette */
            --inquiry-bg: rgba(0, 123, 255, 0.2);
            --inquiry-border: #007bff;
        }

        /* Basic Body Reset */
        body { 
            margin: 0; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background: url('1.jpg') no-repeat center center fixed;
            background-size: cover; 
            color: var(--wa-text); 
            height: 100vh; 
            overflow: hidden; 
            display: flex;
            flex-direction: column;
        }

        /* --- LOADING OVERLAY (Fixed logic) --- */
        #loader { 
            position: absolute; inset: 0; background: var(--wa-bg); z-index: 9999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }

        /* Header UI */
        header { 
            background: var(--wa-header); padding: 15px; display: flex; align-items: center; gap: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
        .back-btn { color: white; text-decoration: none; font-size: 1.5rem; }
        
        /* Message Area */
        #chat-window { 
            flex: 1; overflow-y: auto; padding: 20px; 
            display: flex; flex-direction: column; gap: 12px;
            background: rgba(0,0,0,0.2);
        }

        /* Message Bubbles - Robust styling */
        .msg { 
            padding: 10px 14px; 
            border-radius: 12px; 
            max-width: 85%; 
            word-wrap: break-word;
            overflow-wrap: break-word;
            position: relative;
            display: flex;
            flex-direction: column;
        }
        .sent { background: var(--wa-sent); align-self: flex-end; }
        .received { background: var(--wa-received); align-self: flex-start; }
        
        /* Inquiry Style */
        .inquiry { background: var(--inquiry-bg); border-left: 4px solid var(--inquiry-border); color: #87ceeb; font-style: italic; align-self: center; width: 90%; margin: 10px 0; }

        .msg-text { font-size: 15px; line-height: 1.4; }
        .msg-time { 
            font-size: 10px; color: var(--time-color); 
            align-self: flex-end; margin-top: 5px;
            text-transform: uppercase;
        }

        /* Input Footer */
        .footer-input { background: var(--wa-header); padding: 12px; display: flex; gap: 10px; align-items: center; }
        input { 
            flex: 1; padding: 12px; border-radius: 20px; border: none; 
            background: #2a3942; color: white; outline: none; 
        }
        button { 
            background: var(--wa-green); color: white; border: none; 
            padding: 10px 18px; border-radius: 50%; cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="loader">
        <i class="fa-solid fa-spinner fa-spin" style="font-size: 2.5rem; color: var(--wa-green);"></i>
        <p style="margin-top: 15px; font-size: 0.9rem; opacity: 0.8;">Connecting to Vet...</p>
    </div>

    <div style="height: 100vh; display: flex; flex-direction: column;">
        <header>
            <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
            <div><strong>Vet Master</strong><br><small style="color:var(--wa-green);">Online</small></div>
        </header>

        <div id="chat-window">
            </div>

        <div class="footer-input">
            <input type="text" id="msg-input" placeholder="Type a message...">
            <button onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, setDoc, doc, serverTimestamp, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // Config
        const firebaseConfig = {
            apiKey: "AIzaSyAgdvRUcN5q6r6EkNzlPU6EdNblMNjlMzg",
            authDomain: "happytails-50138.firebaseapp.com",
            projectId: "happytails-50138",
            storageBucket: "happytails-50138.firebasestorage.app",
            messagingSenderId: "377084680099",
            appId: "1:377084680099:web:cb2a3c5f7ce482dd97ac16"
        };

        const db = getFirestore(initializeApp(firebaseConfig));
        const userName = localStorage.getItem('chatUsername') || "Guest_" + Math.floor(Math.random()*1000);

        // --- UTILITY: FORMAT TIME ---
        function formatTime(timestamp) {
            if (!timestamp) return "";
            return timestamp.toDate().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        // --- SAFETY: FAILSAFE FOR LOADER ---
        // This ensures the screen opens even if Firebase is slow or empty
        setTimeout(() => {
            const loader = document.getElementById('loader');
            if (loader.style.display !== 'none') {
                loader.style.display = 'none';
            }
        }, 3000);

        // --- CORE: CHAT LISTENER ---
        const chatWindow = document.getElementById('chat-window');
        
        // This listener tracks every message added to the specific user's chat sub-folder
        onSnapshot(query(collection(db, `conversations/${userName}/messages`), orderBy("timestamp", "asc")), (snap) => {
            chatWindow.innerHTML = "";
            
            // If there is data, render it
            snap.forEach(m => {
                const data = m.data();
                const isSent = data.sender === 'user';
                const bubbleClass = data.type === 'inquiry' ? 'inquiry' : (isSent ? 'sent' : 'received');
                
                chatWindow.innerHTML += `
                    <div class="msg ${bubbleClass}">
                        <span class="msg-text">${data.text}</span>
                        <span class="msg-time">${formatTime(data.timestamp)}</span>
                    </div>
                `;
            });
            
            // Auto scroll to bottom
            chatWindow.scrollTop = chatWindow.scrollHeight;
            
            // Hide loader immediately upon successful data retrieval
            document.getElementById('loader').style.display = 'none';
        });

        // --- CORE: SEND MESSAGE ---
        window.sendMessage = async (text = null, type = 'text') => {
            const input = document.getElementById('msg-input');
            const messageText = text || input.value;
            
            if(!messageText.trim()) return;

            // Step 1: Create/Update the Admin Dashboard index
            await setDoc(doc(db, "conversations", userName), { 
                username: userName, 
                lastSeen: serverTimestamp() 
            }, { merge: true });
            
            // Step 2: Push the message
            await addDoc(collection(db, `conversations/${userName}/messages`), { 
                sender: 'user', 
                text: messageText, 
                type: type, 
                timestamp: serverTimestamp() 
            });
            
            // Clear input if manual
            if(!text) input.value = "";
        };

        // --- CORE: INQUIRY CHECKER ---
        async function checkPendingInquiry() {
            const pending = localStorage.getItem('pending_inquiry');
            if(pending) {
                // Wait briefly then send
                setTimeout(async () => {
                    await sendMessage(pending, 'inquiry');
                    localStorage.removeItem('pending_inquiry');
                }, 1000);
            }
        }
        
        // Initial setup
        checkPendingInquiry();
    </script>
</body>
</html>
